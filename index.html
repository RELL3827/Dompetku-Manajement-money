<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob: http://localhost:4000 https:; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';" />
    
    <title>DompetKu - Manajemen Keuangan Pribadi Offline</title>
    <meta name="description" content="Aplikasi keuangan pribadi 100% offline, gratis, open-source, tanpa iklan, tanpa login, dan privasi penuh dengan penyimpanan lokal IndexedDB." />
    <meta name="author" content="Farel Rizky P" />
    <meta name="theme-color" content="#10b981" />
    <meta name="application-name" content="DompetKu" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DompetKu" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Immediate theme bootstrap to eliminate startup flash -->
    <script>
      (function() {
        try {
          var cachedTheme = localStorage.getItem('dompetku_theme_cache');
          var isDark = false;
          if (cachedTheme === 'dark') {
            isDark = true;
          } else if (cachedTheme === 'light') {
            isDark = false;
          } else {
            isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>

    <!-- Critical Aesthetic Splash Loading Screen: Liquid Glass Edition (5-Second 100% Progress, 60fps GPU Composited) -->
    <style>
      #app-splash-screen {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #070a12;
        color: #f8fafc;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
        pointer-events: all;
        opacity: 1;
        transform: scale(1) translate3d(0, 0, 0);
        transition: opacity 0.5s cubic-bezier(0.2, 0.8, 0.2, 1), transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
        will-change: opacity, transform;
      }
      html:not(.dark) #app-splash-screen {
        background-color: #f8fafc;
        color: #0f172a;
      }
      #app-splash-screen.splash-dismiss {
        opacity: 0;
        transform: scale(1.04) translate3d(0, 0, 0);
        pointer-events: none;
      }

      /* Ambient Liquid Glow Orbs */
      .splash-orb {
        position: absolute;
        border-radius: 9999px;
        pointer-events: none;
        filter: blur(28px);
        transform: translate3d(0, 0, 0);
      }
      .splash-orb-1 {
        width: 360px;
        height: 360px;
        top: 10%;
        right: -40px;
        background: radial-gradient(circle, rgba(16, 185, 129, 0.28) 0%, rgba(5, 150, 105, 0.08) 50%, transparent 75%);
        animation: splash-orb-float-1 12s ease-in-out infinite alternate;
      }
      .splash-orb-2 {
        width: 320px;
        height: 320px;
        bottom: 12%;
        left: -50px;
        background: radial-gradient(circle, rgba(59, 130, 246, 0.2) 0%, rgba(99, 102, 241, 0.07) 50%, transparent 75%);
        animation: splash-orb-float-2 14s ease-in-out infinite alternate;
      }
      .splash-orb-3 {
        width: 280px;
        height: 280px;
        top: 45%;
        left: 20%;
        background: radial-gradient(circle, rgba(244, 63, 94, 0.12) 0%, rgba(245, 158, 11, 0.05) 50%, transparent 75%);
      }

      /* Center Liquid Glass Card */
      .splash-glass-card {
        position: relative;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 2.25rem 1.75rem 2rem 1.75rem;
        width: 88%;
        max-width: 335px;
        border-radius: 2.25rem;
        background: rgba(14, 20, 36, 0.72);
        backdrop-filter: blur(26px) saturate(210%) brightness(105%);
        -webkit-backdrop-filter: blur(26px) saturate(210%) brightness(105%);
        border: 1px solid rgba(255, 255, 255, 0.16);
        box-shadow: 0 24px 55px -12px rgba(0, 0, 0, 0.65), 0 0 35px -5px rgba(16, 185, 129, 0.22), inset 0 1.5px 1.5px 0 rgba(255, 255, 255, 0.38), inset 0 -1px 1px 0 rgba(0, 0, 0, 0.25);
        transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
      }
      html:not(.dark) .splash-glass-card {
        background: rgba(255, 255, 255, 0.75);
        border: 1px solid rgba(255, 255, 255, 0.9);
        box-shadow: 0 20px 45px -10px rgba(16, 185, 129, 0.2), 0 8px 24px -4px rgba(0, 0, 0, 0.08), inset 0 1.5px 1.5px 0 rgba(255, 255, 255, 0.95);
      }

      /* Liquid Glass Emblem */
      .splash-emblem-wrap {
        position: relative;
        margin-bottom: 1.15rem;
      }
      .splash-emblem-glow {
        position: absolute;
        inset: -12px;
        border-radius: 2.5rem;
        background: radial-gradient(circle, rgba(16, 185, 129, 0.45) 0%, transparent 70%);
        filter: blur(14px);
        animation: splash-pulse-glow 2.4s ease-in-out infinite alternate;
      }
      .splash-emblem-box {
        position: relative;
        width: 76px;
        height: 76px;
        border-radius: 1.5rem;
        background: linear-gradient(135deg, rgba(16, 185, 129, 0.24), rgba(6, 78, 59, 0.45));
        border: 1px solid rgba(52, 211, 153, 0.4);
        box-shadow: 0 14px 30px -4px rgba(16, 185, 129, 0.38), inset 0 1.5px 1px rgba(255, 255, 255, 0.45);
        display: flex;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        animation: splash-float 3s ease-in-out infinite;
      }

      /* Liquid Edition Badge */
      .splash-edition-tag {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        padding: 0.2rem 0.65rem;
        border-radius: 9999px;
        font-size: 0.625rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #10b981;
        background: rgba(16, 185, 129, 0.12);
        border: 1px solid rgba(16, 185, 129, 0.25);
        margin-bottom: 0.6rem;
      }
      html:not(.dark) .splash-edition-tag {
        color: #059669;
        background: rgba(16, 185, 129, 0.1);
        border-color: rgba(16, 185, 129, 0.2);
      }

      /* Brand Header */
      .splash-brand {
        margin-bottom: 0.75rem;
      }
      .splash-title {
        margin: 0;
        font-size: 1.625rem;
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1.15;
      }
      .splash-accent {
        color: #10b981;
      }

      /* Dynamic Status Description */
      .splash-status-text {
        font-size: 0.8125rem;
        font-weight: 500;
        color: #94a3b8;
        letter-spacing: -0.01em;
        min-height: 1.25rem;
        transition: color 0.25s ease;
        margin-bottom: 0.85rem;
      }
      html:not(.dark) .splash-status-text {
        color: #64748b;
      }

      /* Liquid Glass Progress Bar */
      .splash-progress-track {
        width: 100%;
        height: 10px;
        border-radius: 9999px;
        background: rgba(148, 163, 184, 0.16);
        border: 1px solid rgba(255, 255, 255, 0.16);
        box-shadow: inset 0 1.5px 3px rgba(0, 0, 0, 0.35);
        overflow: hidden;
        position: relative;
        margin-bottom: 0.6rem;
      }
      html:not(.dark) .splash-progress-track {
        background: rgba(226, 232, 240, 0.75);
        border-color: rgba(255, 255, 255, 0.85);
        box-shadow: inset 0 1.5px 2.5px rgba(0, 0, 0, 0.08);
      }

      .splash-progress-fill {
        height: 100%;
        width: 0%;
        border-radius: 9999px;
        background: linear-gradient(90deg, #059669 0%, #10b981 60%, #34d399 100%);
        box-shadow: 0 0 16px rgba(16, 185, 129, 0.8), inset 0 1px 1px rgba(255, 255, 255, 0.5);
        position: relative;
        transition: width 0.08s linear;
      }
      .splash-progress-fill::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.45), transparent);
        animation: splash-shimmer-pass 1.6s ease-in-out infinite;
      }

      /* Progress Meta (Percentage & Step) */
      .splash-progress-meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        margin-bottom: 1.25rem;
      }
      .splash-pct-box {
        font-variant-numeric: tabular-nums;
        font-feature-settings: "tnum";
        font-weight: 800;
        font-size: 0.95rem;
        color: #10b981;
        display: inline-flex;
        align-items: baseline;
        gap: 1px;
        letter-spacing: -0.01em;
        transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), color 0.25s ease;
      }
      .splash-pct-symbol {
        font-size: 0.75rem;
        font-weight: 700;
        opacity: 0.9;
      }
      .splash-step-text {
        font-size: 0.6875rem;
        font-weight: 600;
        color: #64748b;
        letter-spacing: 0.02em;
      }
      html:not(.dark) .splash-step-text {
        color: #94a3b8;
      }

      /* Completion State */
      #app-splash-screen.splash-complete .splash-pct-box {
        transform: scale(1.15);
        color: #34d399;
        text-shadow: 0 0 12px rgba(52, 211, 153, 0.6);
      }
      #app-splash-screen.splash-complete .splash-glass-card {
        border-color: rgba(52, 211, 153, 0.4);
        box-shadow: 0 24px 55px -12px rgba(0, 0, 0, 0.65), 0 0 45px -2px rgba(16, 185, 129, 0.35), inset 0 1.5px 1.5px 0 rgba(255, 255, 255, 0.5);
      }

      /* Security Pill Badge */
      .splash-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.35rem 0.85rem;
        border-radius: 9999px;
        background: rgba(16, 185, 129, 0.1);
        border: 1px solid rgba(16, 185, 129, 0.25);
        color: #10b981;
        font-size: 0.6875rem;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      html:not(.dark) .splash-badge {
        color: #059669;
        background: rgba(16, 185, 129, 0.08);
        border-color: rgba(16, 185, 129, 0.2);
      }

      /* Footer Watermark */
      .splash-footer {
        position: absolute;
        bottom: calc(1.5rem + env(safe-area-inset-bottom, 0px));
        font-size: 0.6875rem;
        font-weight: 500;
        color: #64748b;
        opacity: 0.85;
        letter-spacing: 0.01em;
      }
      html:not(.dark) .splash-footer {
        color: #94a3b8;
      }

      /* GPU Keyframe Animations */
      @keyframes splash-float {
        0%, 100% { transform: translateY(0) scale(1) translate3d(0, 0, 0); }
        50% { transform: translateY(-3.5px) scale(1.02) translate3d(0, 0, 0); }
      }
      @keyframes splash-pulse-glow {
        0% { opacity: 0.4; transform: scale(0.95) translate3d(0, 0, 0); }
        100% { opacity: 0.85; transform: scale(1.08) translate3d(0, 0, 0); }
      }
      @keyframes splash-shimmer-pass {
        0% { transform: translateX(-100%) translate3d(0, 0, 0); }
        100% { transform: translateX(250%) translate3d(0, 0, 0); }
      }
      @keyframes splash-orb-float-1 {
        0% { transform: translate3d(0, 0, 0) scale(1); }
        100% { transform: translate3d(-30px, 40px, 0) scale(1.08); }
      }
      @keyframes splash-orb-float-2 {
        0% { transform: translate3d(0, 0, 0) scale(1); }
        100% { transform: translate3d(35px, -35px, 0) scale(1.1); }
      }

      @media (prefers-reduced-motion: reduce) {
        .splash-emblem-box,
        .splash-emblem-glow,
        .splash-progress-fill::after,
        .splash-orb-1,
        .splash-orb-2 {
          animation: none !important;
        }
        #app-splash-screen {
          transition: opacity 0.2s ease !important;
        }
        #app-splash-screen.splash-dismiss {
          transform: none !important;
        }
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen antialiased selection:bg-emerald-500/20 selection:text-emerald-500">
    <!-- Aesthetic Initial Startup Splash Screen: Liquid Glass Edition (5-Sec 100% Load) -->
    <div id="app-splash-screen" aria-hidden="true">
      <div class="splash-orb splash-orb-1"></div>
      <div class="splash-orb splash-orb-2"></div>
      <div class="splash-orb splash-orb-3"></div>

      <!-- Signature Liquid Glass Card -->
      <div class="splash-glass-card">
        <div class="splash-emblem-wrap">
          <div class="splash-emblem-glow"></div>
          <div class="splash-emblem-box">
            <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" width="46" height="46">
              <rect x="5" y="10" width="38" height="28" rx="8" fill="url(#splash-em-grad)" stroke="rgba(255,255,255,0.4)" stroke-width="1.75"/>
              <path d="M5 18H43" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
              <path d="M28 21.5H39C40.6569 21.5 42 22.8431 42 24.5V27.5C42 29.1569 40.6569 30.5 39 30.5H28C25.5147 30.5 23.5 28.4853 23.5 26C23.5 23.5147 25.5147 21.5 28 21.5Z" fill="#047857" stroke="rgba(255,255,255,0.45)" stroke-width="1.5"/>
              <circle cx="30.5" cy="26" r="2.2" fill="#34d399"/>
              <path d="M37 7L38 10L41 11L38 12L37 15L36 12L33 11L36 10L37 7Z" fill="#34d399"/>
              <defs>
                <linearGradient id="splash-em-grad" x1="5" y1="10" x2="43" y2="38" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#10b981"/>
                  <stop offset="0.5" stop-color="#059669"/>
                  <stop offset="1" stop-color="#047857"/>
                </linearGradient>
              </defs>
            </svg>
          </div>
        </div>

        <div class="splash-edition-tag">✨ Liquid Glass Edition</div>

        <div class="splash-brand">
          <h1 class="splash-title">Dompet<span class="splash-accent">Ku</span></h1>
        </div>

        <div id="splash-status-text" class="splash-status-text" role="status" aria-live="polite">
          Inisialisasi sistem...
        </div>

        <!-- Semantic Accessible Progress element (hidden visually) -->
        <progress id="splash-progress" value="0" max="100" class="sr-only" aria-label="Proses memuat aplikasi DompetKu"></progress>

        <!-- Visual Liquid Glass Progress Bar -->
        <div class="splash-progress-track">
          <div id="splash-progress-fill" class="splash-progress-fill"></div>
        </div>

        <!-- Percentage Counter & Loading Step -->
        <div class="splash-progress-meta">
          <div class="splash-pct-box">
            <span id="splash-pct-num">0</span><span class="splash-pct-symbol">%</span>
          </div>
          <div id="splash-step-text" class="splash-step-text">Langkah 1/5</div>
        </div>

        <div class="splash-badge">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
          <span>100% Offline • Privasi Penuh</span>
        </div>
      </div>

      <div class="splash-footer">
        <span>v2.16.0 • Liquid Glass Edition</span>
      </div>
    </div>

    <!-- 5-Second 100% Progress Animation Script (Ultra-Lightweight & Smooth) -->
    <script>
      (function() {
        var splash = document.getElementById('app-splash-screen');
        if (!splash) return;

        var fill = document.getElementById('splash-progress-fill');
        var progressEl = document.getElementById('splash-progress');
        var pctText = document.getElementById('splash-pct-num');
        var statusText = document.getElementById('splash-status-text');
        var stepText = document.getElementById('splash-step-text');

        // Total target duration: 4.8 seconds (~5 detik total termasuk exit finish)
        var targetDuration = 4800;
        var startTime = null;
        var startWallClock = Date.now();
        var isCompleted = false;

        var stages = [
          { at: 0, text: 'Inisialisasi sistem...', step: '1/5 Memulai' },
          { at: 24, text: 'Pemeriksaan basis data offline...', step: '2/5 Basis Data' },
          { at: 50, text: 'Sinkronisasi saldo & kategori...', step: '3/5 Sinkronisasi' },
          { at: 75, text: 'Merender antarmuka Liquid Glass...', step: '4/5 Rendering' },
          { at: 94, text: 'Mengoptimalkan performa 60 FPS...', step: '5/5 Finalisasi' },
          { at: 100, text: 'Selesai! Selamat datang di DompetKu', step: '100% Siap' }
        ];

        function getStage(pct) {
          var matched = stages[0];
          for (var i = 0; i < stages.length; i++) {
            if (pct >= stages[i].at) {
              matched = stages[i];
            }
          }
          return matched;
        }

        function updateProgress(timestamp) {
          if (isCompleted) return;
          if (!startTime) startTime = timestamp;

          // Compute progress with wall clock fallback in case rAF throttles in background
          var rAFElapsed = timestamp - startTime;
          var wallElapsed = Date.now() - startWallClock;
          var elapsed = Math.max(rAFElapsed, wallElapsed);

          var rawProgress = Math.min(elapsed / targetDuration, 1);

          // Natural easing curve (steady start, smooth acceleration, decisive finish at 100%)
          var eased = 1 - Math.pow(1 - rawProgress, 2.3);
          var pct = Math.min(Math.round(eased * 100), 100);

          if (fill) fill.style.width = pct + '%';
          if (progressEl) progressEl.value = pct;
          if (pctText) pctText.textContent = pct;

          var st = getStage(pct);
          if (statusText && statusText.textContent !== st.text) {
            statusText.textContent = st.text;
          }
          if (stepText && stepText.textContent !== st.step) {
            stepText.textContent = st.step;
          }

          if (rawProgress < 1) {
            window.requestAnimationFrame(updateProgress);
          } else {
            isCompleted = true;
            if (fill) fill.style.width = '100%';
            if (progressEl) progressEl.value = 100;
            if (pctText) pctText.textContent = '100';
            if (statusText) statusText.textContent = 'Selesai! Selamat datang di DompetKu';
            if (stepText) stepText.textContent = '100% Siap';

            splash.classList.add('splash-complete');

            // Hold 100% state for 450ms so user clearly perceives completion
            setTimeout(function() {
              if (splash) {
                splash.classList.add('splash-dismiss');
                setTimeout(function() {
                  if (splash && splash.parentNode) {
                    splash.parentNode.removeChild(splash);
                  }
                }, 550);
              }
            }, 450);
          }
        }

        window.requestAnimationFrame(updateProgress);

        // Failsafe auto-dismiss after 7.5s in case of any unhandled browser interrupt
        setTimeout(function() {
          var s = document.getElementById('app-splash-screen');
          if (s && !s.classList.contains('splash-dismiss')) {
            s.classList.add('splash-dismiss');
            setTimeout(function() { if (s && s.parentNode) s.parentNode.removeChild(s); }, 550);
          }
        }, 7500);
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
